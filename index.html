<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="SkillTroc Colombia: aprende una habilidad, comparte una habilidad, crezcamos juntos. Versión de demostración.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SkillTroc Colombia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: phone-style app shell centred on a lavender stage (matches the SkillTroc Lovable prototype); header + scrolling main + 5-tab bottom bar. Admin views widen the shell. */
:root{
  --stage:oklch(93% .03 277); --frame:oklch(20% .02 265);
  --bg:oklch(98.5% .004 264); --surface:oklch(100% 0 0); --sunk:oklch(96% .008 264);
  --ink:oklch(21% .03 265); --muted:oklch(52% .03 260); --line:oklch(92% .01 264);
  --primary:oklch(51.1% .23 277); --on-primary:oklch(99% 0 0); --primary-soft:oklch(94% .04 277); --primary-ink:oklch(38% .17 277);
  --grad:linear-gradient(135deg, oklch(51.1% .23 277), oklch(60% .2 300));
  --coin:oklch(76.9% .165 70); --coin-soft:oklch(96% .06 85); --coin-line:oklch(86% .1 80); --coin-ink:oklch(42% .11 55);
  --match:oklch(50% .12 163); --match-soft:oklch(95% .05 163); --match-ink:oklch(38% .09 163);
  --bad:oklch(55% .21 25); --bad-soft:oklch(95% .03 25);
  --shadow:0 1px 2px oklch(21% .03 265 / .06), 0 8px 24px oklch(40% .1 277 / .08);
  --f-display:"Sora", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:oklch(14% .02 270); --frame:oklch(8% .01 265);
  --bg:oklch(18% .02 265); --surface:oklch(23% .025 265); --sunk:oklch(26% .025 265);
  --ink:oklch(96% .01 264); --muted:oklch(74% .02 260); --line:oklch(32% .02 264);
  --primary:oklch(72% .15 277); --on-primary:oklch(18% .04 277); --primary-soft:oklch(32% .08 277); --primary-ink:oklch(84% .1 277);
  --coin-soft:oklch(31% .06 75); --coin-line:oklch(45% .09 75); --coin-ink:oklch(87% .1 82);
  --match:oklch(50% .12 163); --match-soft:oklch(30% .05 163); --match-ink:oklch(84% .1 163);
  --bad:oklch(72% .16 25); --bad-soft:oklch(30% .06 25);
  --shadow:0 1px 2px oklch(0% 0 0 / .3), 0 8px 24px oklch(0% 0 0 / .25); color-scheme:dark }}
:root[data-theme="dark"]{
  --stage:oklch(14% .02 270); --frame:oklch(8% .01 265);
  --bg:oklch(18% .02 265); --surface:oklch(23% .025 265); --sunk:oklch(26% .025 265);
  --ink:oklch(96% .01 264); --muted:oklch(74% .02 260); --line:oklch(32% .02 264);
  --primary:oklch(72% .15 277); --on-primary:oklch(18% .04 277); --primary-soft:oklch(32% .08 277); --primary-ink:oklch(84% .1 277);
  --coin-soft:oklch(31% .06 75); --coin-line:oklch(45% .09 75); --coin-ink:oklch(87% .1 82);
  --match:oklch(50% .12 163); --match-soft:oklch(30% .05 163); --match-ink:oklch(84% .1 163);
  --bad:oklch(72% .16 25); --bad-soft:oklch(30% .06 25);
  --shadow:0 1px 2px oklch(0% 0 0 / .3), 0 8px 24px oklch(0% 0 0 / .25); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--primary-ink)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
/* shell */
.shell{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.shell.wide{max-width:1040px}
@media (min-width:620px){.shell{height:calc(100% - 40px);margin-block:20px;border-radius:40px;border:10px solid var(--frame);box-shadow:0 30px 60px oklch(30% .1 277 / .25)}.shell.wide{border-radius:28px}}
.top{flex:none;background:var(--bg);border-bottom:1px solid var(--line);z-index:5;padding-top:env(safe-area-inset-top,0px)}
.top .bar{display:flex;align-items:center;gap:8px;min-height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.3rem;text-decoration:none;color:var(--ink);margin-right:auto;letter-spacing:-.02em}
.brand span{color:var(--primary)}
.planchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:99px;font-weight:700;font-size:.86rem;text-decoration:none;border:1.5px solid var(--coin-line);background:var(--coin-soft);color:var(--coin-ink)}
.planchip.free{border-color:transparent;background:var(--primary-soft);color:var(--primary-ink)}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%, oklch(88% .14 90), var(--coin));box-shadow:inset 0 0 0 2px oklch(70% .15 65)}
.lang{min-height:36px;min-width:44px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 .8rem var(--f-body);cursor:pointer}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scroll-padding-top:12px}
main:focus{outline:none}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;min-height:60px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:700;position:relative;border-radius:16px}
.tabbar a[aria-current="page"]{color:var(--primary-ink)}
.tabbar svg{width:23px;height:23px}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:800}
.tabbar .badge{position:absolute;top:5px;left:56%}
/* layout primitives */
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.pagehead p{color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.card.flat{background:var(--sunk);border-color:transparent;box-shadow:none}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.82rem;font-weight:700;color:var(--primary-ink)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:99px;border:0;background:var(--grad);color:#fff;font:700 .95rem var(--f-body);text-decoration:none;cursor:pointer;box-shadow:0 6px 16px oklch(51% .23 277 / .25)}
.btn.ghost{background:var(--surface);color:var(--primary-ink);border:1.5px solid var(--line);box-shadow:none}
.btn.quiet{background:var(--sunk);color:var(--ink);box-shadow:none}
.btn.danger{background:var(--surface);border:1.5px solid var(--bad);color:var(--bad);box-shadow:none}
.btn.sm{min-height:38px;padding:7px 15px;font-size:.86rem}
.btn.cta{width:100%;min-height:56px;font-size:1.05rem;border-radius:18px}
.btn.white{background:#fff;color:oklch(38% .17 277);box-shadow:none}
.btn.onGrad{background:oklch(100% 0 0 / .14);color:#fff;border:1.5px solid oklch(100% 0 0 / .5);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
:is(.btn,.lang,a,input,select,textarea,.chip,.round,.opt-card,button,summary):focus-visible{outline:3px solid var(--coin);outline-offset:2px}
/* chips & tags */
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 16px;font:600 .9rem var(--f-body);cursor:pointer;min-height:40px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:thin}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.tag.career,.tag.verified{background:var(--primary-soft);color:var(--primary-ink)}
.tag.creative{background:oklch(95% .04 330);color:oklch(42% .15 330)}
:root[data-theme="dark"] .tag.creative{background:oklch(30% .07 330);color:oklch(85% .09 330)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.creative{background:oklch(30% .07 330);color:oklch(85% .09 330)}}
.tag.sun{background:var(--coin-soft);color:var(--coin-ink)}
.tag.ok{background:var(--match-soft);color:var(--match-ink)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-weight:800;font-size:.8rem}
.pill.direct{background:var(--match);color:#fff}
.pill.plan{background:var(--coin-soft);color:var(--coin-ink);border:1.5px solid var(--coin-line)}
/* forms */
label{font-weight:700;font-size:.92rem;display:block;margin-bottom:6px}
.opt{font-weight:500;color:var(--muted);font-size:.82rem}
input[type=text],input[type=tel],input[type=url],input[type=search],input[type=datetime-local],input[type=number],select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-md);padding:10px 14px;font:16px var(--f-body)}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
textarea{min-height:96px;resize:vertical}
.search{position:relative}
.search input{padding-left:44px;min-height:54px;border-radius:18px;box-shadow:var(--shadow)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.field{min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--primary)}
.err{color:var(--bad);font-size:.88rem;font-weight:700}
.notice{border-radius:var(--r-md);padding:12px 14px;background:var(--coin-soft);color:var(--coin-ink);font-size:.92rem;border:1.5px solid var(--coin-line)}
.notice.info{background:var(--primary-soft);color:var(--ink);border-color:transparent}
details>summary{cursor:pointer}
/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:5px;border-radius:20px;background:var(--sunk)}
.seg button{min-height:52px;border:0;border-radius:16px;background:transparent;color:var(--muted);font:700 .86rem/1.25 var(--f-body);cursor:pointer;padding:6px 8px}
.seg button[aria-pressed="true"]{background:var(--match);color:#fff;box-shadow:0 6px 14px oklch(50% .12 163 / .25)}
.seg button.plan[aria-pressed="true"]{background:var(--coin-soft);color:var(--coin-ink);box-shadow:inset 0 0 0 1.5px var(--coin-line)}
/* avatars */
.avatar{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;object-fit:cover;font-family:var(--f-display)}
.avatar.lg{width:96px;height:96px;font-size:2rem}
.tile{width:64px;height:64px;border-radius:18px;flex:none;display:grid;place-items:center;background:var(--grad);color:oklch(20% .05 277);font:700 1.1rem var(--f-display);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
/* list rows */
.list{display:grid;gap:12px}
.item{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;box-shadow:var(--shadow)}
.item>div{min-width:0;flex:1}
a.item{text-decoration:none;color:inherit}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.meta svg{width:14px;height:14px;flex:none}
.why{background:var(--primary-soft);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-size:.9rem;margin-top:8px}
/* match card deck */
.mcard{border-radius:28px;overflow:hidden;background:var(--surface);box-shadow:0 20px 40px oklch(40% .12 277 / .18);border:1px solid var(--line)}
.mcard-art{position:relative;aspect-ratio:1/0.82;max-width:100%;background:var(--grad);display:grid;place-items:center}
.mcard-art .pill{position:absolute;top:14px;left:14px}
.mcard-art .initials{font:600 3.4rem var(--f-display);letter-spacing:.08em;color:oklch(20% .05 277)}
.mcard-art img{width:100%;height:100%;object-fit:cover}
.mcard-body{padding:18px 20px 20px;display:grid;gap:10px}
.mcard-body h2{font-size:1.7rem;font-weight:800}
.lbl-teach{color:var(--match-ink);font-weight:800}
.lbl-want{color:var(--primary-ink);font-weight:800}
.actions{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:18px}
.round{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;color:var(--bad);text-decoration:none}
.round svg{width:28px;height:28px}
.round.star{width:54px;height:54px;color:var(--coin)}
.round.heart{width:76px;height:76px;background:var(--grad);border:0;color:#fff;box-shadow:0 12px 24px oklch(51% .23 277 / .35)}
.round.heart svg{width:34px;height:34px}
.deckcount{text-align:center;color:var(--muted);font-size:.86rem;margin-top:10px}
/* gradient header (profiles) */
.gheader{background:var(--grad);color:#fff;margin-inline:-16px;margin-top:-20px;padding:28px 20px 26px;text-align:center;display:grid;justify-items:center;gap:6px}
.gheader .avatar.lg,.gheader .ring{width:116px;height:116px;border-radius:50%;background:oklch(100% 0 0 / .18);box-shadow:0 0 0 6px oklch(100% 0 0 / .12);display:grid;place-items:center;font:600 2.4rem var(--f-display);color:#fff;object-fit:cover}
.gheader h1{font-size:1.8rem;color:#fff}
.gheader .sub{opacity:.92;font-weight:600}
.gheader .meta{color:#fff;opacity:.95;justify-content:center;font-weight:700}
.gheader .progress{width:min(260px,100%);background:oklch(100% 0 0 / .25)}
.gheader .progress>i{background:#fff}
.optcard{background:var(--coin-soft);border:1.5px solid var(--coin-line);border-radius:var(--r);padding:16px 18px;color:var(--coin-ink)}
.optcard b{display:block;font-size:.8rem;font-weight:800;letter-spacing:.04em;margin-bottom:4px}
.optcard p{color:var(--ink);font-weight:700;font-size:1.02rem}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{min-height:46px;padding:10px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem}
/* numbered steps (real sequences only) */
.stephead{display:flex;align-items:center;gap:10px}
.stepnum{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-weight:800;font-size:.86rem;flex:none}
.opt-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;min-height:56px}
.opt-card input{width:20px;height:20px;accent-color:var(--primary);flex:none}
.opt-card:has(input:checked){border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary)}
.opt-card.plan:has(input:checked){border-color:var(--coin);background:var(--coin-soft)}
.opt-card:has(input:disabled){opacity:.55;cursor:not-allowed}
.daypick{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
/* banners */
.banner-ok{background:var(--match);color:#fff;border-radius:var(--r);padding:18px 20px}
.banner-ok h1{color:#fff;font-size:1.45rem}
.dash{border:2px dashed oklch(70% .12 277);background:var(--primary-soft);border-radius:var(--r);padding:18px}
.hero-card{background:var(--grad);color:#fff;border-radius:28px;padding:26px 22px;display:grid;gap:14px;box-shadow:0 20px 40px oklch(40% .12 277 / .2)}
.hero-card h1{color:#fff;font-size:clamp(1.9rem,7vw,2.4rem);font-weight:800}
.hero-card p{opacity:.95;font-weight:500}
.swaps{display:grid;gap:10px}
.swap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow)}
.swap span{font-weight:700;font-size:.95rem;min-width:0}
.swap span:last-child{text-align:right}
.swap b{color:var(--primary);font-family:var(--f-display);font-size:1.2rem}
.progress{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--grad);border-radius:99px}
.price{font-family:var(--f-display);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow)}
.steps li::before{content:counter(s);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-weight:800;font-size:.86rem}
.story{display:grid;gap:14px}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}
.faq summary{font-weight:700;min-height:32px}
.faq details p{margin-top:8px;color:var(--muted)}
.menu{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.menu a,.menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:12px 18px;text-decoration:none;color:var(--ink);font:600 .98rem var(--f-body);background:transparent;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.menu a:last-child,.menu button:last-child{border-bottom:0}
.menu svg{width:18px;height:18px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow-y:auto;padding:12px;background:var(--sunk);border-radius:var(--r)}
.msg{max-width:82%;padding:9px 13px;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-color:transparent}
.msg time{display:block;font-size:.72rem;opacity:.75}
.availgrid{display:grid;grid-template-columns:auto repeat(7,minmax(34px,1fr));gap:4px;font-size:.78rem;overflow-x:auto}
.availgrid button{min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);font:700 .75rem var(--f-body)}
.availgrid button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.availgrid .h{text-align:center;font-weight:700;color:var(--muted);align-self:end}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.kpi .card b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
.legal{max-width:68ch}
.legal h3{margin-top:18px}
.legal p,.legal li{margin-top:8px}
.draft{border:2px dashed var(--coin);color:var(--coin-ink);border-radius:var(--r-md);padding:10px 14px;font-weight:700}

<body>
<div class="shell" id="shell">
  <header class="top"><div class="bar"><a class="brand" href="#inicio" aria-label="SkillTroc, inicio">Skill<span>Troc</span></a><span id="planchip"></span><button class="lang" id="langBtn" data-act="lang" aria-label="Cambiar idioma / Change language">EN</button></div></header>

<script>
"use strict";
/* =========================================================
   SkillTroc Colombia — pilot app
   Data lives in the artifact database (db capability).
   ========================================================= */
const APP_URL = "https://claude.ai/artifact/Qo6tC1MzMiEFB4TD95MTkR";
const LEGAL_V = "2026-10-borrador";
const TZ = "America/Bogota";
const PRICES = { monthly: 18000, annual: 107000 };

let lang = "es";
try { lang = localStorage.getItem("st-lang") || "es"; } catch (e) {}
const T = (es, en) => (lang === "es" ? es : en);
const LOC = () => (lang === "es" ? "es-CO" : "en-US");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const now = () => new Date().toISOString();
const cop = (n) => new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 }).format(n) + " COP";
const fdt = (iso) => { try { return new Intl.DateTimeFormat(LOC(), { timeZone: TZ, weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }).format(new Date(iso)); } catch (e) { return iso; } };
const fd = (iso) => { try { return new Intl.DateTimeFormat(LOC(), { timeZone: TZ, day: "numeric", month: "short", year: "numeric" }).format(new Date(iso)); } catch (e) { return iso; } };
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
const DAY = 864e5;

/* ---------- Categories (structural data) ---------- */
const CATS = [
  ["excel","career","Excel y hojas de cálculo","Excel & spreadsheets"],
  ["powerpoint","career","PowerPoint y presentaciones","PowerPoint & presentations"],
  ["canva","career","Canva y diseño gráfico","Canva & graphic design"],
  ["programacion","career","Programación","Coding & programming"],
  ["datos","career","Análisis de datos","Data analytics"],
  ["marketing","career","Marketing digital","Digital marketing"],
  ["redes","career","Gestión de redes sociales","Social media management"],
  ["contenido","career","Creación de contenido digital","Digital content creation"],
  ["video","career","Edición de video","Video editing"],
  ["idiomas","career","Idiomas","Languages"],
  ["comunicacion","career","Comunicación","Communication"],
  ["oratoria","career","Hablar en público","Public speaking"],
  ["hojavida","career","Hoja de vida","CV & résumé"],
  ["entrevistas","career","Práctica de entrevistas","Interview practice"],
  ["productividad","career","Herramientas de productividad","Productivity tools"],
  ["emprendimiento","career","Emprendimiento y negocios","Entrepreneurship & business"],
  ["otra-pro","career","Otra habilidad profesional","Other professional skill"],
  ["pintura","creative","Pintura y dibujo","Painting & drawing"],
  ["manualidades","creative","Manualidades","Arts & crafts"],
  ["fotografia","creative","Fotografía","Photography"],
  ["baile","creative","Baile","Dance"],
  ["canto","creative","Canto","Singing"],
  ["guitarra","creative","Guitarra","Guitar"],
  ["piano","creative","Piano","Piano"],
  ["instrumentos","creative","Otros instrumentos","Other instruments"],
  ["cocina","creative","Cocina","Cooking"],
  ["reposteria","creative","Repostería","Baking"],
  ["costura","creative","Costura","Sewing"],
  ["diy","creative","Hazlo tú mismo (DIY)","DIY"],
  ["edicion-creativa","creative","Edición creativa","Creative editing"],
  ["vida-practica","creative","Habilidades prácticas para la vida","Practical life skills"],
  ["otra-cre","creative","Otra habilidad creativa","Other creative skill"],
].map(([slug, stream, es, en]) => ({ slug, stream, es, en }));
const CAT = Object.fromEntries(CATS.map((c) => [c.slug, c]));
const catName = (s) => (CAT[s] ? T(CAT[s].es, CAT[s].en) : s);
const CUSTOM_CATS = ["otra-pro", "otra-cre"];
const TITLE_CATS = ["idiomas", "instrumentos", "otra-pro", "otra-cre", "programacion"];
const STREAMS = {
  career: () => T("Habilidades profesionales y digitales", "Career & digital skills"),
  creative: () => T("Habilidades creativas y cotidianas", "Creative & everyday skills"),
};
const LEVELS = { basico: () => T("Básico", "Beginner"), intermedio: () => T("Intermedio", "Intermediate"), avanzado: () => T("Avanzado", "Advanced") };
const LV = { basico: 1, intermedio: 2, avanzado: 3 };
const FORMATS = { online: () => T("En línea", "Online"), presencial: () => T("Presencial", "In person"), ambos: () => T("En línea o presencial", "Online or in person") };
const LANGS = { es: () => T("Español", "Spanish"), en: () => T("Inglés", "English"), pt: () => T("Portugués", "Portuguese"), fr: () => T("Francés", "French") };
const DAYS = [["mon","Lun","Mon"],["tue","Mar","Tue"],["wed","Mié","Wed"],["thu","Jue","Thu"],["fri","Vie","Fri"],["sat","Sáb","Sat"],["sun","Dom","Sun"]];
const SLOTS = [["am","Mañana","Morning"],["pm","Tarde","Afternoon"],["ev","Noche","Evening"]];

/* ---------- State ---------- */
const S = {
  db: null, user: null, uid: null, canWrite: null, isOwner: false, ready: false, offline: false,
  profiles: {}, moderation: {}, config: {}, exchanges: {}, events: {}, blocks: {}, institutions: {}, coord: {},
  mySub: null, myReports: null, myPqr: null, myPrivacy: null, myAnalytics: null,
  all: { subs: {}, reports: {}, pqr: {}, privacy: {}, analytics: {}, audit: [] },
  messages: [], msgUnsub: null, msgEx: null,
  route: "inicio", param: "",
  ob: null, filters: { q: "", stream: "", cat: "", level: "", city: "", format: "", lang: "", day: "", obj: "" },
};
const me = () => (S.uid ? S.profiles[S.uid] : null);
const isMember = () => !!(me() && me().onboarded && !me().deleted);

/* ---------- Helpers on data ---------- */
const mod = (uid) => S.moderation[uid] || {};
const hiddenCats = () => S.config.hiddenCats || [];
const approvedEvents = () => S.config.approvedEvents || [];
const coordinators = () => S.config.coordinators || {};
const myCoordInst = () => coordinators()[S.uid] || null;
const isBlockedPair = (a, b) => (S.blocks[a]?.ids || []).includes(b) || (S.blocks[b]?.ids || []).includes(a);
const visibleProfile = (p) => p && p.onboarded && !p.deleted && p.visibility !== "hidden" && !mod(p.uid).suspended;
const listingVisible = (p, l) => {
  if (hiddenCats().includes(l.cat)) return false;
  if ((mod(p.uid).hiddenListings || []).includes(l.id)) return false;
  if (CUSTOM_CATS.includes(l.cat) && !(mod(p.uid).approved || []).includes(l.id)) return false;
  return true;
};
const activeListings = (p, dir) => (p?.[dir] || []).filter((l) => listingVisible(p, l));
const displayName = (uid) => { const p = S.profiles[uid]; if (!p || p.deleted) return T("Usuario eliminado", "Deleted user"); return p.name || T("Sin nombre", "Unnamed"); };
const COLORS = ["#1D5B47", "#A1266A", "#8A5A00", "#2F5D8A", "#6B3FA0", "#9C3D2E"];
function avatar(uid, cls = "") {
  const p = S.profiles[uid];
  if (p && p.avatar && !p.deleted) return `<img class="avatar ${cls}" src="${esc(p.avatar)}" alt="">`;
  const n = displayName(uid); let h = 0; for (const c of String(uid)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `<span class="avatar ${cls}" style="background:${COLORS[h % COLORS.length]}" aria-hidden="true">${esc((n[0] || "?").toUpperCase())}</span>`;
}
function completion(p) {
  if (!p) return 0;
  const checks = [!!p.name, !!p.bio && p.bio.length >= 20, !!p.avatar, !!p.city, !!p.format, (p.langs || []).length > 0, (p.avail || []).length > 0, (p.teach || []).length + (p.learn || []).length > 0, !!p.goals];
  return Math.round((checks.filter(Boolean).length / checks.length) * 100);
}
function subActive(sub) { return !!(sub && sub.status === "active" && sub.periodEnd && new Date(sub.periodEnd) > new Date()); }
function subView(sub) {
  if (!sub || !sub.status || sub.status === "none") return "none";
  if (sub.status === "active" && new Date(sub.periodEnd) <= new Date()) return sub.cancelAtPeriodEnd ? "expired" : "past_due";
  return sub.status;
}
const myExchanges = () => Object.values(S.exchanges).filter((x) => x.a === S.uid || x.b === S.uid);
const other = (x) => (x.a === S.uid ? x.b : x.a);
function sessionStatus(s) {
  if (s.status === "confirmed" || s.status === "completed") {
    const done = s.completedBy || [];
    if (done.length >= 2) return "completed";
    if (done.length === 1 && Date.now() - new Date(s.completedAt || s.startsAt).getTime() > 2 * DAY) return "completed";
    if (done.length === 1) return "pending_confirm";
  }
  return s.status;
}
function completedSessions(uid) {
  const out = [];
  for (const x of Object.values(S.exchanges)) if (x.a === uid || x.b === uid) for (const s of x.sessions || []) if (sessionStatus(s) === "completed") out.push({ x, s, at: s.startsAt });
  return out.sort((a, b) => a.at.localeCompare(b.at));
}
function unreadCount() {
  let n = 0;
  for (const x of myExchanges()) {
    if (x.status === "pending" && x.b === S.uid) n++;
    else if (x.lastMsgAt && x.lastMsgFrom !== S.uid && (!x.readAt || !x.readAt[S.uid] || x.readAt[S.uid] < x.lastMsgAt)) n++;
    else for (const s of x.sessions || []) if (s.status === "proposed" && s.proposedBy !== S.uid) { n++; break; }
  }
  return n;
}
function reviewsFor(uid) {
  const out = [];
  for (const x of Object.values(S.exchanges)) {
    for (const [k, r] of Object.entries(x.reviews || {})) {
      if (r.about !== uid) continue;
      const sid = k.split(":")[0];
      const both = Object.values(x.reviews).filter((q) => q.session === sid).length >= 2;
      if (both || Date.now() - new Date(r.at).getTime() > 7 * DAY) out.push(r);
    }
  }
  return out;
}
function titlesMatch(a, b) {
  const wa = norm(a).split(/\W+/).filter((w) => w.length > 2), wb = norm(b).split(/\W+/).filter((w) => w.length > 2);
  return wa.some((w) => wb.includes(w));
}
function skillPairs(teachList, learnList) {
  const out = [];
  for (const t of teachList) for (const l of learnList) {
    if (t.cat !== l.cat) continue;
    if (TITLE_CATS.includes(t.cat) && !titlesMatch(t.title, l.title)) continue;
    out.push({ t, l });
  }
  return out;
}
function formatOk(a, b) {
  const on = (f) => f === "online" || f === "ambos", inp = (f) => f === "presencial" || f === "ambos";
  if (on(a.format) && on(b.format)) return "online";
  if (inp(a.format) && inp(b.format) && norm(a.city) === norm(b.city)) return "presencial";
  return null;
}
function matchWith(o) {
  const m = me(); if (!m || !o || o.uid === m.uid || !visibleProfile(o) || isBlockedPair(m.uid, o.uid)) return null;
  const theyGive = skillPairs(activeListings(o, "teach"), activeListings(m, "learn"));
  if (!theyGive.length) return null;
  const iGive = skillPairs(activeListings(m, "teach"), activeListings(o, "learn"));
  const type = iGive.length ? "reciprocal" : "oneway";
  const sharedLangs = (m.langs || []).filter((l) => (o.langs || []).includes(l));
  const fmt = formatOk(m, o);
  const availOverlap = (m.avail || []).filter((a) => (o.avail || []).includes(a)).length;
  let score = type === "reciprocal" ? 100 : 40;
  score += sharedLangs.length ? 15 : -20;
  score += fmt ? 10 : -15;
  score += Math.min(availOverlap, 5) * 3;
  if (norm(m.city) === norm(o.city)) score += 6;
  const g = theyGive[0];
  if (LV[g.t.level] > LV[g.l.level]) score += 5;
  const n = o.name || T("esta persona", "this person");
  const reasons = [];
  if (type === "reciprocal") {
    const i = iGive[0];
    reasons.push(T(`Tú puedes enseñar ${i.t.title} y ${n} quiere aprenderlo; a cambio, ${n} enseña ${g.t.title}.`, `You can teach ${i.t.title}, which ${n} wants to learn; in return ${n} teaches ${g.t.title}.`));
  } else {
    reasons.push(T(`${n} enseña ${g.t.title}, que tú quieres aprender. Todavía no tienes una habilidad que esta persona busque, así que sería aprendizaje con el Plan Aprendiz.`, `${n} teaches ${g.t.title}, which you want to learn. You don't list a skill they're looking for yet, so this would be learning with the Learner Plan.`));
  }
  if (sharedLangs.length) reasons.push(T("Hablan ", "You both speak ") + sharedLangs.map((l) => LANGS[l]?.() || l).join(", ") + ".");
  else reasons.push(T("No comparten un idioma registrado.", "You don't share a listed language."));
  if (fmt) reasons.push(fmt === "online" ? T("Ambos aceptan sesiones en línea.", "You both accept online sessions.") : T(`Ambos aceptan encuentros presenciales en ${o.city}.`, `You both accept in-person sessions in ${o.city}.`));
  if (availOverlap) reasons.push(T(`Coinciden en ${availOverlap} franja(s) de disponibilidad.`, `${availOverlap} matching availability slot(s).`));
  return { o, type, score, iGive, theyGive, reasons };
}
function allMatches() {
  return Object.values(S.profiles).map(matchWith).filter(Boolean).sort((a, b) => (b.type === "reciprocal") - (a.type === "reciprocal") || b.score - a.score);
}

/* ---------- DB writes ---------- */
async function guard() {
  if (!S.db || !S.uid) { toast(T("Abre SkillTroc con tu cuenta para participar.", "Open SkillTroc signed in to take part.")); return false; }
  if (S.canWrite === false) { toast(T("Tu acceso es de solo lectura. Pide acceso de colaborador.", "You have read-only access. Ask for contributor access.")); return false; }
  return true;
}
async function write(fn, okMsg) {
  if (!(await guard())) return false;
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    console.error(e);
    const code = e && e.code;
    if (code === "invalid_argument" && S.canWrite === null) S.canWrite = false;
    toast(code === "quota_exceeded" ? T("Se llenó el espacio de la base de datos. Avísale al administrador.", "The database is full. Tell the administrator.") : code === "unavailable" ? T("Sin conexión con el servidor. Inténtalo de nuevo en un momento.", "Can't reach the server. Try again in a moment.") : T("No se pudo guardar. Revisa tu conexión e inténtalo otra vez.", "Couldn't save. Check your connection and try again."));
    return false;
  }
}
const saveProfile = (p) => write(() => S.db.doc("profiles/" + S.uid).set({ ...p, uid: S.uid, updatedAt: now() }));
const saveExchange = (x) => S.db.doc("exchanges/" + x.id).set({ ...x, updatedAt: now() });
async function audit(action, target) { try { await S.db.collection("audit").add({ actor: S.uid, action, target, at: now() }); } catch (e) {} }
async function bumpAnalytics(field) {
  if (!S.db || !S.uid || S.canWrite === false) return;
  const a = { ...(S.myAnalytics || {}) }; a[field] = (a[field] || 0) + 1; a.lastActive = now();
  S.myAnalytics = a;
  try { await S.db.doc("analytics/" + S.uid).set(a); } catch (e) {}
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3600); }

/* ---------- Render loop (preserves form input across live updates) ---------- */
let raf = 0;
function refresh() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; render(); }); }
function render() {
  const app = document.getElementById("app");
  const saved = {}; app.querySelectorAll("input[id],textarea[id],select[id]").forEach((el) => { if (el.type === "file") return; saved[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  const radios = {}; app.querySelectorAll("input[type=radio]:checked").forEach((el) => (radios[el.name] = el.value));
  const act = document.activeElement && document.activeElement.id; let sel = null;
  try { if (act && document.activeElement.selectionStart != null) sel = [document.activeElement.selectionStart, document.activeElement.selectionEnd]; } catch (e) {}
  const chat = app.querySelector(".chat"); const chatAtBottom = chat ? chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40 : true;
  renderNav();
  let html;
  try { html = (VIEWS[S.route] || VIEWS.inicio)(S.param); } catch (e) { console.error(e); html = `<div class="card"><h2>${T("Algo falló al mostrar esta página", "Something went wrong showing this page")}</h2><p class="muted">${T("Vuelve al inicio e inténtalo de nuevo.", "Go back home and try again.")}</p><p><a class="btn" href="#inicio">${T("Ir al inicio", "Go home")}</a></p></div>`; }
  app.innerHTML = demoBanner() + html + footer();
  for (const [id, v] of Object.entries(saved)) { const el = document.getElementById(id); if (!el || el.dataset.fresh) continue; if (el.type === "checkbox") el.checked = v; else el.value = v; }
  for (const [n, v] of Object.entries(radios)) { const el = app.querySelector(`input[type=radio][name="${n}"][value="${v}"]`); if (el && !el.disabled) el.checked = true; }
  if (act) { const el = document.getElementById(act); if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  const c2 = app.querySelector(".chat"); if (c2 && chatAtBottom) c2.scrollTop = c2.scrollHeight;
}
function go(hash) { if (location.hash === "#" + hash) { route(); } else location.hash = hash; }
function route() {
  const h = (location.hash || "#inicio").slice(1);
  let r = h, p = "";
  for (const pre of ["u-", "ex-", "inst-", "legal-", "ev-", "ref-", "reservar-", "enviada-"]) if (h.startsWith(pre)) { r = pre.slice(0, -1); p = h.slice(pre.length); }
  if (r === "ref") { try { sessionStorage.setItem("st-ref", p); } catch (e) {} S.pendingRef = p; r = "inicio"; }
  const changed = r !== S.route || p !== S.param;
  S.route = VIEWS[r] ? r : "inicio"; S.param = p;
  if (S.route === "ex" && isMember()) subscribeMessages(p); else subscribeMessages(null);
  if (S.route === "bienvenida" && !S.ob) startOnboarding();
  render();
  if (changed) { document.getElementById("app").scrollTo(0, 0); }
}
window.addEventListener("hashchange", route);

/* ---------- Shared bits ---------- */

  return `<footer class="foot"><nav aria-label="${T("Información legal", "Legal")}">
    <a href="#legal-privacidad">${T("Política de datos", "Data policy")}</a><a href="#legal-terminos">${T("Términos", "Terms")}</a><a href="#legal-comunidad">${T("Normas de la comunidad", "Community guidelines")}</a><a href="#legal-suscripcion">${T("Términos de suscripción", "Subscription terms")}</a><a href="#legal-seguridad">${T("Seguridad", "Safety")}</a><a href="#legal-pqr">PQR</a><a href="#instituciones">${T("Instituciones", "Institutions")}</a><a href="#eventos">${T("Eventos", "Events")}</a><a href="#planes">${T("Planes", "Plans")}</a><a href="#invitar">${T("Invitar", "Invite")}</a>
  </nav><p>SkillTroc Colombia · ${T("Aprende una habilidad. Comparte una habilidad. Crezcamos juntos.", "Learn a skill. Share a skill. Grow together.")}</p>
  <p>${T("Versión piloto: los pagos están en modo demostración y los textos legales son borradores pendientes de revisión.", "Pilot version: payments run in demo mode and legal texts are drafts pending review.")}</p></footer>`;
}
function needMember(what) {
  if (!S.ready) return `<div class="stack"><div class="skeleton"></div><div class="skeleton"></div></div>`;
  if (!S.db || !S.uid) return `<div class="card stack"><h2>${T("Inicia sesión para " + what, "Sign in to " + what)}</h2><p class="muted">${T("SkillTroc funciona con tu cuenta. Abre este enlace con la sesión iniciada; si no puedes, pídele a quien te invitó que te dé acceso de colaborador.", "SkillTroc uses your account. Open this link while signed in; if you can't, ask whoever invited you for contributor access.")}</p></div>`;
  if (!isMember()) return `<div class="card stack"><h2>${T("Primero crea tu perfil", "Create your profile first")}</h2><p class="muted">${T("Son cinco pasos cortos. No te pedimos pagos ni tu dirección.", "Five short steps. We don't ask for payment or your address.")}</p><p><a class="btn" href="#bienvenida">${T("Empieza gratis", "Start free")}</a></p></div>`;
  if (mod(S.uid).suspended) return `<div class="card"><h2>${T("Tu cuenta está suspendida", "Your account is suspended")}</h2><p class="muted">${T("Si crees que es un error, envía una PQR.", "If you think this is a mistake, send a complaint form.")}</p><p><a class="btn" href="#legal-pqr">PQR</a></p></div>`;
  return null;
}
function streamTag(s) { return `<span class="tag ${s}">${esc(STREAMS[s]?.() || s)}</span>`; }
function listingCard(p, l, dir) {
  const c = CAT[l.cat];

function subscribeMessages(id) {
  if (S.msgEx === id) return;
  if (S.msgUnsub) { try { S.msgUnsub(); } catch (e) {} S.msgUnsub = null; }
  S.msgEx = id; S.messages = [];
  if (!id || !S.db) return;
  try {
    S.msgUnsub = S.db.collection("exchanges/" + id + "/messages").orderBy("at").limit(500).onSnapshot((snap) => {
      S.messages = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      const x = S.exchanges[id];
      if (x && x.lastMsgAt && (!x.readAt || !x.readAt[S.uid] || x.readAt[S.uid] < x.lastMsgAt) && S.canWrite !== false) {
        const readAt = { ...(x.readAt || {}), [S.uid]: now() };
        S.db.doc("exchanges/" + id).update({ readAt }).catch(() => {});
      }
      refresh();
    }, (e) => console.warn("messages", e));
  } catch (e) { console.error(e); }
}

function median(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function metrics() {
  const ps = Object.values(S.profiles).filter((p) => p.onboarded && !p.deleted);
  const xs = Object.values(S.exchanges);
  const firstDone = {}; const doneCount = {};
  for (const p of ps) { const cs = completedSessions(p.uid); doneCount[p.uid] = cs.length; if (cs.length) firstDone[p.uid] = cs[0].at; }
  const withFirst = Object.keys(firstDone);
  const days = withFirst.map((u) => (new Date(firstDone[u]) - new Date(S.profiles[u].createdAt)) / DAY).filter((d) => d >= 0);
  const repeatBase = withFirst.filter((u) => Date.now() - new Date(firstDone[u]) > 30 * DAY);
  const repeat = repeatBase.filter((u) => completedSessions(u).filter((c) => new Date(c.at) - new Date(firstDone[u]) <= 30 * DAY).length >= 2);
  const decided = xs.filter((x) => ["accepted", "declined", "closed"].includes(x.status) || (x.status === "cancelled" && x.wasAccepted));
  const accepted = xs.filter((x) => x.status === "accepted" || x.status === "closed" || x.wasAccepted);
  const allRevs = xs.flatMap((x) => Object.values(x.reviews || {}));
  const an = Object.values(S.all.analytics);
  const subs = Object.values(S.all.subs);
  const real = subs.filter((s) => s.provider && s.provider !== "demo"), demo = subs.filter((s) => s.provider === "demo");
  const reports = Object.values(S.all.reports).flatMap((r) => r.items || []);
  const resTimes = reports.filter((r) => r.resolvedAt).map((r) => (new Date(r.resolvedAt) - new Date(r.at)) / DAY);
  const gatedUsers = an.filter((a) => a.gatedAttempts > 0).length;
  const paidReal = real.filter(subActive).length;
  return {
    users: ps.length, complete: ps.filter((p) => completion(p) >= 80).length, listings: ps.reduce((s, p) => s + (p.teach || []).length + (p.learn || []).length, 0),
    firstPct: ps.length ? Math.round((withFirst.length / ps.length) * 100) : null, medDays: median(days), requests: xs.length,
    acceptRate: decided.length ? Math.round((accepted.length / decided.length) * 100) : null, repeat30: repeatBase.length ? Math.round((repeat.length / repeatBase.length) * 100) : null,
    avgRating: allRevs.length ? (allRevs.reduce((s, r) => s + r.rating, 0) / allRevs.length).toFixed(1) : null,
    learnedYes: allRevs.length ? Math.round((allRevs.filter((r) => r.learned === "si").length / allRevs.length) * 100) : null,
    active7: an.filter((a) => a.lastActive && Date.now() - new Date(a.lastActive) < 7 * DAY).length, active30: an.filter((a) => a.lastActive && Date.now() - new Date(a.lastActive) < 30 * DAY).length,
    searches: an.reduce((s, a) => s + (a.searches || 0), 0), referrals: ps.filter((p) => p.referredBy).length,
    paidReal, paidDemo: demo.filter(subActive).length, cancels: subs.filter((s) => s.cancelAtPeriodEnd || s.status === "cancelled").length,
    revenue: real.flatMap((s) => s.history || []).filter((h) => h.status === "ok").reduce((s, h) => s + (h.amount || 0), 0),
    conv: gatedUsers ? Math.round((paidReal / gatedUsers) * 100) : null, gatedUsers,
    reportsOpen: reports.filter((r) => ["open", "reviewing"].includes(r.status)).length, reportsTotal: reports.length, medRes: median(resTimes),
    sessions: xs.flatMap((x) => x.sessions || []).filter((s) => sessionStatus(s) === "completed").length,
  };
}

VIEWS.descubrir = () => {
  const f = S.filters; const mode = isMember() ? (S.searchMode || "direct") : "all";
  const rows = []; const recip = {};
  for (const p of Object.values(S.profiles)) {
    if (!visibleProfile(p) || (S.uid && isBlockedPair(S.uid, p.uid))) continue;
    if (isMember() && p.uid !== S.uid) { const mt = matchWith(p); if (mt && mt.type === "reciprocal") recip[p.uid] = true; }
    const dir = f.dir === "learn" ? "learn" : "teach";
    if (mode === "direct" && dir === "teach" && !recip[p.uid]) continue;
    for (const l of activeListings(p, dir)) {
      if (f.stream && CAT[l.cat]?.stream !== f.stream) continue;
      if (f.cat && l.cat !== f.cat) continue;
      if (f.level && l.level !== f.level) continue;
      if (f.city && norm(p.city) !== norm(f.city) && !norm(p.hood).includes(norm(f.city))) continue;
      if (f.format && !(f.format === "online" ? ["online", "ambos"] : ["presencial", "ambos"]).includes(l.format || p.format)) continue;
      if (f.lang && !(p.langs || []).includes(f.lang)) continue;
      if (f.day && !(p.avail || []).some((a) => a.startsWith(f.day))) continue;
      if (f.q && !norm(l.title + " " + catName(l.cat) + " " + (l.desc || "")).includes(norm(f.q))) continue;
      if (f.obj && !norm((l.objectives || "") + " " + (p.goals || "")).includes(norm(f.obj))) continue;
      rows.push({ p, l, dir });
    }
  }
  rows.sort((a, b) => (!!recip[b.p.uid] - !!recip[a.p.uid]) || (b.p.uid === S.uid) - (a.p.uid === S.uid) || a.l.title.localeCompare(b.l.title));
  const page = S.page || 1; const shown = rows.slice(0, page * 20);

      <p class="muted">${esc(l.title)}</p>

    </div></a>`;
  };
  return `<div class="stack">

    <div class="chiprow" role="group" aria-label="${T("Categorías", "Categories")}">
      <button class="chip" data-act="catChip" data-v="" aria-pressed="${!f.cat}">${T("Todas", "All")}</button>
      ${QUICK_CATS.filter((c) => !hiddenCats().includes(c)).map((c) => `<button class="chip" data-act="catChip" data-v="${c}" aria-pressed="${f.cat === c}">${esc(catName(c))}</button>`).join("")}

      <div class="grid3" style="margin-top:12px">
        ${sel("f-dir", [["learn", T("Personas que quieren aprender", "People who want to learn")]], f.dir || "", T("Mostrar", "Show"))}
        ${sel("f-stream", [["career", STREAMS.career()], ["creative", STREAMS.creative()]], f.stream, T("Camino", "Stream"))}
        ${sel("f-cat", catsForStream.map((c) => [c.slug, catName(c.slug)]), f.cat, T("Categoría", "Category"))}

  </div>`;

function addSkill(prefix, dir, list) {
  const cat = document.getElementById(`${prefix}-${dir}-cat`).value, titleEl = document.getElementById(`${prefix}-${dir}-title`), level = document.getElementById(`${prefix}-${dir}-level`).value;
  const title = titleEl.value.trim() || catName(cat);
  if (list.some((l) => norm(l.title) === norm(title) && l.cat === cat)) { toast(T("Ya agregaste esa habilidad.", "You already added that skill.")); return; }
  if (list.length >= 10) { toast(T("Máximo 10 habilidades por lista.", "Maximum 10 skills per list.")); return; }
  list.push({ id: rid(), cat, title, level, format: "", lang: "es", desc: "", objectives: "", portfolio: "" });
  titleEl.value = "";
  if (CUSTOM_CATS.includes(cat)) toast(T("La revisaremos antes de publicarla.", "We'll review it before it's published."));
}

  const r = b.dataset.r; const plan = S.checkout;
  if (r === "cancel") { S.checkout = null; toast(T("Pago cancelado. No se hizo ningún cobro.", "Payment cancelled. No charge was made.")); render(); return; }

  history.push({ at: now(), label, amount: PRICES[plan], status: "ok" });

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.name === "ob-pref") S.ob.preference = el.value;
  const kind = el.dataset.change;
  if (kind === "filter") { readFilters(); S.page = 1; render(); }
  if (kind === "adminQ") { S.adminQ = el.value; render(); }
  if (kind === "photo" && el.files && el.files[0]) compressPhoto(el.files[0]).then((url) => { if (S.route === "bienvenida") { readOb(); S.ob.avatar = url; } else if (S.pe) { syncPeListings(); S.pe.avatar = url; } render(); }).catch(() => toast(T("No pudimos leer esa imagen. Prueba con otra.", "We couldn't read that image. Try another.")));
});

function compressPhoto(file) {
  return new Promise((res, rej) => {
    if (!file.type.startsWith("image/")) return rej();
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const s = 192; const c = document.createElement("canvas"); c.width = s; c.height = s; const ctx = c.getContext("2d"); const m = Math.min(img.width, img.height); ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.72)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); }; img.src = url;
  });
}

let STANDALONE = !(window.claude && typeof window.claude.use === "function");
let DEMO_FALLBACK = false;
const DEMO_KEY = "skilltroc-demo-db-v1";
function makeLocalDB() {
  let data = {};
  try { data = JSON.parse(localStorage.getItem(DEMO_KEY) || "{}"); } catch (e) { data = {}; }
  const listeners = new Set();
  const persist = () => { try { localStorage.setItem(DEMO_KEY, JSON.stringify(data)); } catch (e) {} };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const segs = (p) => p.split("/").length;
  const meta = { fromCache: false, hasPendingWrites: false };
  const docSnap = (path) => { const id = path.split("/").pop(); const d = data[path]; return { id, exists: !!d, data: () => (d ? clone(d) : undefined), metadata: meta }; };
  function runQuery(colPath, q) {
    let rows = Object.keys(data).filter((k) => k.startsWith(colPath + "/") && segs(k) === segs(colPath) + 1).map((k) => docSnap(k));
    if (q.order) { const [f, dir] = q.order; rows.sort((a, b) => { const x = a.data()[f], y = b.data()[f]; if (x === y) return 0; if (x === undefined) return 1; if (y === undefined) return -1; return (x < y ? -1 : 1) * (dir === "desc" ? -1 : 1); }); }
    else rows.sort((a, b) => a.id.localeCompare(b.id));
    if (q.lim) rows = rows.slice(0, q.lim);
    return { docs: rows, size: rows.length, empty: !rows.length, docChanges: () => [], metadata: meta };
  }
  const notify = () => { persist(); setTimeout(() => listeners.forEach((l) => { try { l(); } catch (e) { console.error(e); } }), 0); };
  function docRef(path) {
    return {
      id: path.split("/").pop(), path,
      get: async () => docSnap(path),
      set: async (d) => { data[path] = clone(d); notify(); },
      update: async (d) => { if (!data[path]) throw { code: "invalid_argument", message: "missing" }; data[path] = { ...data[path], ...clone(d) }; notify(); },
      delete: async () => { delete data[path]; notify(); },
      onSnapshot: (next) => { const l = () => next(docSnap(path)); listeners.add(l); l(); return () => listeners.delete(l); },
      collection: (sub) => colRef(path + "/" + sub),
      acquire: async () => ({ acquired: true }),
    };
  }
  function colRef(path, q = {}) {
    const self = {
      path,
      doc: (id) => docRef(path + "/" + (id || rid())),
      add: async (d) => { const r = docRef(path + "/" + rid()); await r.set(d); return r; },
      where: () => self,
      orderBy: (f, dir) => colRef(path, { ...q, order: [f, dir || "asc"] }),
      limit: (n) => colRef(path, { ...q, lim: n }),
      get: async () => runQuery(path, q),
      onSnapshot: (next) => { const l = () => next(runQuery(path, q)); listeners.add(l); l(); return () => listeners.delete(l); },
    };
    return self;
  }
  return { doc: docRef, collection: colRef, _isEmpty: () => !Object.keys(data).length, _seed: (rows) => { Object.assign(data, clone(rows)); persist(); } };
}
function localUser() {
  let id = null;
  try { id = localStorage.getItem("skilltroc-demo-uid"); if (!id) { id = "local-" + rid(); localStorage.setItem("skilltroc-demo-uid", id); } } catch (e) { id = "local-" + rid(); }
  return { id: async () => id, isOwner: async () => true, canEdit: async () => true, can: async () => true, me: async () => ({ id, name: "", isOwner: true, canEdit: true }) };
}
function demoSeed() {
  const t = new Date().toISOString();
  const allSlots = (days, slots) => days.flatMap((d) => slots.map((s) => d + "-" + s));
  const L = (cat, title, level, extra = {}) => ({ id: rid(), cat, title, level, format: "", lang: "es", desc: "", objectives: "", portfolio: "", ...extra });
  const P = (code, name, city, hood, format, langs, streams, bio, teach, learn, avail) => ({ uid: "demo-" + code, demo: true, name, city, country: "Colombia", hood, showHood: true, format, langs, streams, bio, teach, learn, avail, goals: "", links: [], visibility: "visible", refCode: "demo" + code, onboarded: true, deleted: false, createdAt: t, updatedAt: t, consents: {} });
  const rows = {};
  const people = [
    P("laura", "Laura (demo)", "Medellín", "Laureles", "ambos", ["es", "en"], ["career"], "Perfil de ejemplo para la demostración. Estudio Negocios Internacionales y practico inglés todos los días.", [L("idiomas", "Inglés conversacional", "avanzado", { desc: "Conversación para entrevistas y viajes.", objectives: "Presentarte con seguridad y responder preguntas de entrevista." })], [L("excel", "Excel con tablas dinámicas", "basico")], allSlots(["tue", "thu"], ["pm", "ev"])),
    P("valentina", "Valentina (demo)", "Medellín", "El Poblado", "presencial", ["es"], ["creative"], "Perfil de ejemplo para la demostración. Fotógrafa aficionada, me encanta la luz de la tarde en el centro.", [L("fotografia", "Fotografía con celular", "intermedio", { objectives: "Componer, usar la luz natural y editar en el celular." })], [L("guitarra", "Guitarra para principiantes", "basico")], allSlots(["sat", "sun"], ["am", "pm"])),
    P("camilo", "Camilo (demo)", "Envigado", "", "online", ["es"], ["career"], "Perfil de ejemplo para la demostración. Desarrollador junior; quiero mejorar mi inglés técnico.", [L("programacion", "Python desde cero", "intermedio"), L("datos", "Análisis de datos con Python", "intermedio")], [L("idiomas", "Inglés técnico", "basico")], allSlots(["mon", "wed", "fri"], ["ev"])),
    P("sofia", "Sofía (demo)", "Medellín", "Belén", "ambos", ["es"], ["creative", "career"], "Perfil de ejemplo para la demostración. Tengo un emprendimiento de postres y necesito mejorar mis publicaciones.", [L("reposteria", "Repostería básica", "avanzado")], [L("canva", "Canva para redes sociales", "basico")], allSlots(["wed", "sat"], ["am", "pm"])),
    P("mateo", "Mateo (demo)", "Bello", "", "online", ["es", "en"], ["career"], "Perfil de ejemplo para la demostración. Contador; enseño Excel y quiero aprender a bailar salsa.", [L("excel", "Excel para el trabajo", "avanzado", { objectives: "Fórmulas, tablas dinámicas y gráficos." })], [L("baile", "Salsa caleña", "basico")], allSlots(["tue", "thu", "sat"], ["ev"])),
    P("andres", "Andrés (demo)", "Medellín", "Robledo", "ambos", ["es"], ["creative"], "Perfil de ejemplo para la demostración. Toco guitarra hace diez años y quiero aprender fotografía.", [L("guitarra", "Guitarra acústica", "avanzado")], [L("fotografia", "Fotografía con celular", "basico")], allSlots(["fri", "sat"], ["pm", "ev"])),
  ];
  for (const p of people) rows["profiles/" + p.uid] = p;
  const ev = { id: "demo-ev1", title: "Caminata fotográfica por Laureles (demo)", desc: "Evento de ejemplo para la demostración. Recorrido de 2 horas para practicar fotografía con celular.", stream: "creative", startsAt: new Date(Date.now() + 5 * DAY).toISOString(), capacity: 15, online: false, city: "Medellín", venue: "Parque Lleras de Laureles", organiser: "demo-valentina", attendees: ["demo-valentina"], createdAt: t, cancelled: false };
  rows["events/" + ev.id] = ev;
  rows["config/app"] = { approvedEvents: [ev.id] };
  return rows;
}
const isDemoUid = (uid) => STANDALONE && String(uid || "").startsWith("demo-");
function demoPanel(x) {
  if (!STANDALONE) return "";
  const o = other(x); if (!isDemoUid(o)) return "";
  const n = esc(displayName(o));
  const sessions = x.sessions || [];
  const myProposed = sessions.find((s) => s.status === "proposed" && s.proposedBy === S.uid);
  const futureConfirmed = sessions.find((s) => s.status === "confirmed" && new Date(s.startsAt) > new Date());
  const btns = [];
  if (x.status === "pending" && x.a === S.uid) btns.push(`<button class="btn sm" data-act="demoAccept" data-id="${x.id}">${T(`Simular: ${n} acepta`, `Simulate: ${n} accepts`)}</button>`);
  if (x.status === "accepted") btns.push(`<button class="btn quiet sm" data-act="demoMsg" data-id="${x.id}">${T(`Simular mensaje de ${n}`, `Simulate message from ${n}`)}</button>`);
  if (myProposed) btns.push(`<button class="btn sm" data-act="demoConfirm" data-id="${x.id}" data-s="${myProposed.id}">${T(`Simular: ${n} confirma la sesión`, `Simulate: ${n} confirms`)}</button>`);
  if (futureConfirmed) btns.push(`<button class="btn quiet sm" data-act="demoPast" data-id="${x.id}" data-s="${futureConfirmed.id}">${T("Simular que la sesión ya pasó", "Simulate the session has happened")}</button>`);
  if (!btns.length) return "";
  return `<div class="demo stack"><span>${T("Modo demostración: esta persona es un perfil de ejemplo. Usa estos botones para simular sus respuestas.", "Demo mode: this is an example profile. Use these buttons to simulate their replies.")}</span><div class="row">${btns.join("")}</div></div>`;
}
function demoBanner() {
  if (!STANDALONE) return "";
  return `<div class="row between small" style="margin:-8px 0 14px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--primary-soft);flex-wrap:nowrap"><span style="min-width:0">${T("Demo: tus datos quedan solo en este navegador.", "Demo: your data stays in this browser.")}</span><button class="btn quiet sm" data-act="demoReset" style="min-height:32px;padding:4px 12px;flex:none;background:var(--surface)">${T("Reiniciar", "Reset")}</button></div>`;
}
async function demoExUpdate(id, fn, msg) { const x = S.exchanges[id]; if (!x) return; const nx = fn({ ...x }); nx.updatedAt = now(); await S.db.doc("exchanges/" + id).set(nx); S.exchanges[id] = nx; if (msg) toast(msg); render(); }
ACT.demoAccept = (b) => demoExUpdate(b.dataset.id, (x) => ({ ...x, status: "accepted", wasAccepted: true, acceptedAt: now() }), T("Solicitud aceptada (simulado).", "Request accepted (simulated)."));
ACT.demoConfirm = (b) => demoExUpdate(b.dataset.id, (x) => ({ ...x, sessions: x.sessions.map((s) => (s.id === b.dataset.s ? { ...s, status: "confirmed", confirmedAt: now() } : s)) }), T("Sesión confirmada (simulado).", "Session confirmed (simulated)."));
ACT.demoPast = (b) => demoExUpdate(b.dataset.id, (x) => ({ ...x, sessions: x.sessions.map((s) => (s.id === b.dataset.s ? { ...s, startsAt: new Date(Date.now() - 2 * 3600e3).toISOString(), completedBy: [other(x)], completedAt: now() } : s)) }), T("La sesión ya pasó. Ahora márcala como completada.", "The session has happened. Now mark it as completed."));
ACT.demoMsg = async (b) => {
  const id = b.dataset.id; const x = S.exchanges[id]; const o = other(x);
  const lines = [T("¡Hola! Me encanta la idea. ¿Te sirve el jueves en la tarde?", "Hi! I love the idea. Does Thursday afternoon work for you?"), T("Perfecto. Propón la sesión y yo la confirmo.", "Perfect. Propose the session and I'll confirm it."), T("¡Gracias por la clase! Nos vemos la próxima.", "Thanks for the session! See you next time.")];
  const n = (S.messages || []).filter((m) => m.from === o).length;
  await S.db.collection("exchanges/" + id + "/messages").add({ from: o, body: lines[n % lines.length], at: now() });
  await S.db.doc("exchanges/" + id).update({ lastMsgAt: now(), lastMsgFrom: o });
};
ACT.demoReset = () => { try { localStorage.removeItem(DEMO_KEY); Object.keys(localStorage).filter((k) => k.startsWith("st-pass-")).forEach((k) => localStorage.removeItem(k)); } catch (e) {} location.hash = "#inicio"; location.reload(); };

/* =========================================================
   BOOT
   ========================================================= */
function subDoc(path, onData) { try { return S.db.doc(path).onSnapshot((d) => { onData(d.exists ? d.data() : null); refresh(); }, (e) => console.warn(path, e)); } catch (e) { console.error(e); } }
function subCol(path, onData, q) { try { let ref = S.db.collection(path); if (q) ref = q(ref); return ref.onSnapshot((snap) => { onData(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); refresh(); }, (e) => console.warn(path, e)); } catch (e) { console.error(e); } }
const byId = (arr, key = "id") => Object.fromEntries(arr.map((x) => [x[key] || x.id, x]));
async function boot() {
  route();
  let db, user;
  if (STANDALONE) { db = makeLocalDB(); if (db._isEmpty()) db._seed(demoSeed()); user = localUser(); }
  else [db, user] = await Promise.all([claude.use("db").catch(() => null), claude.use("user").catch(() => null)]);
  if (!db) { STANDALONE = true; DEMO_FALLBACK = true; db = makeLocalDB(); if (db._isEmpty()) db._seed(demoSeed()); user = localUser(); }
  S.db = db; S.user = user;
  if (user) { S.uid = await user.id(); S.isOwner = await user.isOwner(); S.canWrite = await user.can("data.write"); }
  if (!S.uid && !STANDALONE) { STANDALONE = true; DEMO_FALLBACK = true; S.db = makeLocalDB(); if (S.db._isEmpty()) S.db._seed(demoSeed()); S.user = localUser(); S.uid = await S.user.id(); S.isOwner = true; S.canWrite = true; }
  let first = 0; const need = 3; const mark = () => { if (++first >= need && !S.ready) { S.ready = true; route(); } };
  subCol("profiles", (rows) => { S.profiles = byId(rows.map((r) => ({ ...r, uid: r.uid || r.id }))); mark(); });
  subCol("moderation", (rows) => { S.moderation = byId(rows); });
  subDoc("config/app", (d) => { S.config = d || {}; mark(); });
  subCol("exchanges", (rows) => { S.exchanges = byId(rows); mark(); });
  subCol("events", (rows) => { S.events = byId(rows); });
  subCol("blocks", (rows) => { S.blocks = byId(rows); });
  subCol("institutions", (rows) => { S.institutions = byId(rows); });
  subCol("coord", (rows) => { S.coord = byId(rows); });
  if (S.uid) {
    subDoc("subscriptions/" + S.uid, (d) => (S.mySub = d));
    subDoc("reports/" + S.uid, (d) => (S.myReports = d));
    subDoc("pqr/" + S.uid, (d) => (S.myPqr = d));
    subDoc("privacy/" + S.uid, (d) => (S.myPrivacy = d));
    try { const a = await S.db.doc("analytics/" + S.uid).get(); S.myAnalytics = a.exists ? a.data() : {}; const last = S.myAnalytics.lastActive; if (!last || last.slice(0, 10) !== now().slice(0, 10)) { S.myAnalytics.lastActive = now(); if (S.canWrite !== false) S.db.doc("analytics/" + S.uid).set(S.myAnalytics).catch(() => {}); } } catch (e) {}
  }
  if (S.isOwner) {
    subCol("subscriptions", (rows) => { S.all.subs = byId(rows); });
    subCol("reports", (rows) => { S.all.reports = byId(rows); });
    subCol("pqr", (rows) => { S.all.pqr = byId(rows); });
    subCol("privacy", (rows) => { S.all.privacy = byId(rows); });
    subCol("analytics", (rows) => { S.all.analytics = byId(rows); });
    subCol("audit", (rows) => { S.all.audit = rows; }, (r) => r.orderBy("at", "desc").limit(200));
  }
  setTimeout(() => { if (!S.ready) { S.ready = true; render(); } }, 8000);
}
boot();
</script>
